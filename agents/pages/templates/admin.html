<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Libertas</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/tokens.css?v=1">
    <link rel="stylesheet" href="/app-config.css">
    <link rel="stylesheet" href="/static/css/main.css?v=18">
    <link rel="stylesheet" href="/static/css/admin.css?v=1">
</head>
<body>
    {{ nav | safe }}

    <div class="admin-hero">
        <h1><i class="fas fa-chart-line"></i> Admin Dashboard</h1>
    </div>

    <div class="admin-content">

        <div id="auth-gate" class="auth-gate">
            <i class="fas fa-lock"></i>
            <h2>Admin Access</h2>
            <p>Enter the admin key to view the dashboard.</p>
            <input type="password" id="admin-key-input" placeholder="Admin key" autofocus>
            <button id="auth-btn">Unlock</button>
            <div class="auth-error" id="auth-error" style="display:none;"></div>
        </div>

        <div id="dashboard">
            <div class="stat-grid" id="stat-grid"></div>

            <div class="section">
                <h2><i class="fas fa-users"></i> Recent Users</h2>
                <table id="users-table">
                    <thead><tr>
                        <th>ID</th><th>Username</th><th>Email</th><th>Joined</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="section">
                <h2><i class="fas fa-route"></i> Recent Trips</h2>
                <table id="trips-table">
                    <thead><tr>
                        <th>ID</th><th>Title</th><th>Link</th><th>User</th><th>Created</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="/static/js/admin.js?v=1"></script>
</body>
</html>
